{% extends "base.html" %}

{% block content %}
  <h1>Cars</h1>

  <ul>
    {% for car in cars %}
      <li>
        <a href="{% url 'taxi:car-detail' pk=car.id %}">
          {{ car.model }} ({{ car.manufacturer.name }})
        </a>
      </li>
    {% empty %}
      <li>No cars</li>
    {% endfor %}
  </ul>
{% endblock %}
